[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-data-polytopes"
version = "20170220.0"
description = "Databases of two- and three-dimensional reflexive polytopes for SageMath"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "DATA_LICENSES.md"]
authors = [
  {name = "The Sage Developers"},
]
keywords = ["SageMath", "PALP", "lattice polytopes", "reflexive polytopes", "database"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/cxzhong/sage-data-polytopes"
Repository = "https://github.com/cxzhong/sage-data-polytopes"
Issues = "https://github.com/cxzhong/sage-data-polytopes/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_data_polytopes = [
  "data/Full2d/*",
  "data/Full3d/*",
  "data/reflexive_polytopes_2d",
  "data/reflexive_polytopes_3d",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
