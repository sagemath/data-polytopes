[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polytope-databases"
version = "20170220.2"
description = "Databases of two- and three-dimensional reflexive polytopes"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "DATA_LICENSES.md"]
authors = [
  {name = "The Sage Developers"},
]
keywords = ["SageMath", "PALP", "lattice polytopes", "reflexive polytopes", "database"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/sagemath/data-polytopes"
Repository = "https://github.com/sagemath/data-polytopes"
Issues = "https://github.com/sagemath/data-polytopes/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polytope_databases = [
  "data/Full2d/*",
  "data/Full3d/*",
  "data/reflexive_polytopes_2d",
  "data/reflexive_polytopes_3d",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
