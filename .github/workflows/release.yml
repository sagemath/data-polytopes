name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release tag
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag not in {version, f"v{version}"}:
              raise SystemExit(f"release tag {tag!r} does not match version {version!r}")
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build pip twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata and contents
        run: |
          python -m twine check dist/*
          python tools/check_artifacts.py dist/*.whl dist/*.tar.gz
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/sagemath-data-polytopes-smoke
          /tmp/sagemath-data-polytopes-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/sagemath-data-polytopes-smoke/bin/python -c "import sage_data_polytopes as d; d.verify_data(); assert d.reflexive_polytopes(3).is_file()"
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/
      - name: Attach distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sagemath-data-polytopes
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
